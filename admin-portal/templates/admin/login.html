<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrator sign in · Age-Safe Media</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/admin.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">🛡️</div>
      <div>
        <strong>Age-Safe Media</strong>
        <div class="tiny muted">Admin Web Portal</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage the catalogue, families and the recommendation model.</p>

    {% if error %}
    <div class="flash flash-error" role="alert" style="margin-top:18px">
      <span class="flash-dot"></span>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" autocomplete="on">
      <input type="hidden" name="next" value="{{ next or '/admin' }}">
      <div class="field">
        <label for="email">Administrator e-mail</label>
        <input id="email" name="email" type="email" required autocomplete="username"
               value="{{ email or '' }}" placeholder="admin@agesafe.sg">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               placeholder="••••••••">
      </div>
      <button class="btn" type="submit" style="margin-top:4px">Sign in to portal</button>
    </form>

    <div class="login-hint">
      Local demo credentials: <code>{{ settings.admin_email }}</code> /
      <code>{{ settings.admin_password }}</code> — change them in the API server's environment file.
    </div>
  </main>
</body>
</html>
